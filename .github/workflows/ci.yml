name: CI

# Läuft kostenfrei nur bei ÖFFENTLICHEN Repositories (GitHub-gehostete
# Standard-Runner ohne Minutenlimit). Deshalb sind alle Jobs auf ein
# öffentliches Repo beschränkt und verwenden nur Standard-Runner und
# kostenlose Werkzeuge.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Überholte Läufe desselben PR/Branches abbrechen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Prüft den Workflow selbst (Syntax, Kontext-/Expression-Referenzen,
      # unbekannte Action-Inputs).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint

  shellcheck:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          command -v shellcheck || { sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y shellcheck; }
          shellcheck controller.sh

  bats:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Namen mit Umlauten (valid_name nutzt [:alpha:]) brauchen eine UTF-8-Locale.
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (bats, tmux, python3)
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y bats tmux python3
      - name: Run bats test suite
        run: bats test/controller.bats

  gitleaks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI statt gitleaks-action: die Action verlangt für Repos in einer
      # GitHub-Organisation einen kostenpflichtigen Lizenzschlüssel, das CLI
      # nicht. Version fest gepinnt, Prüfsumme wird verifiziert.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
