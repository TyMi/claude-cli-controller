# logrotate-Config fuer claude-cli-controller
#
# Rotiert die pipe-pane-Mitschriften unter .../logs/*.log (die
# .snapshot.txt-Dateien aus dem O1-Feature brauchen KEINE Rotation, da sie
# bei jedem Supervisor-Tick ueberschrieben statt angehaengt werden).
#
# Installation (Platzhalter <user> zuvor ersetzen):
#   sudo cp logrotate/claude-cli-controller.conf /etc/logrotate.d/claude-cli-controller
#   sudo sed -i 's#<user>#DEIN-USER#g' /etc/logrotate.d/claude-cli-controller
#
# copytruncate ist noetig, da tmux' "pipe-pane" die Datei die ganze Zeit
# offen haelt - ein normales rename+neu-anlegen wuerde die laufende
# pipe-pane-Instanz nicht mitbekommen (siehe docs/TROUBLESHOOTING.md).

/home/<user>/.local/state/claude-cli-controller/logs/*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
